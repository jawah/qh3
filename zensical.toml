[project]
site_url = "https://qh3.readthedocs.io/"
site_name = "qh3"
site_description = "A fast QUIC and HTTP/3 implementation for Python"
site_author = "The qh3 maintainers"
copyright = "Copyright &copy; 2019 Jeremy Laine and qh3 contributors"
repo_url = "https://github.com/jawah/qh3"
repo_name = "jawah/qh3"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "Asyncio" = "guides/asyncio.md" },
    { "Sans-I/O" = "guides/sans-io.md" },
    { "Design" = "guides/design.md" },
  ] },
  { "API reference" = [
    { "Public API" = "api/index.md" },
    { "Asyncio" = "api/asyncio.md" },
    { "Configuration" = "api/configuration.md" },
    { "QUIC" = "api/quic.md" },
    { "HTTP/3" = "api/http3.md" },
    { "Events" = "api/events.md" },
    { "Logging" = "api/logging.md" },
    { "TLS types" = "api/tls.md" },
  ] },
  { "API stability" = "api-stability.md" },
  { "License" = "license.md" },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]
options.docstring_style = "sphinx"
options.inherited_members = false
options.members_order = "source"
options.separate_signature = true
options.show_root_full_path = false
options.show_source = false
options.show_symbol_type_heading = true
options.show_symbol_type_toc = true
