version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - python -m pip install -r docs/docs-requirements.txt
    build:
      html:
        - python -m zensical build --clean --strict
    post_build:
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp --recursive site/* "$READTHEDOCS_OUTPUT/html/"
